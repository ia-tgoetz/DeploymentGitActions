# Test overlay — adds a central gateway container alongside Edge for GAN testing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build

services:
  ignition-edge:
    depends_on:
      ignition-central:
        condition: service_healthy

  # Central gateway uses the same derived image (modules baked in via Dockerfile).
  # If you don't want modules on the central GW, override image: with the bare
  # base image: `image: ghcr.io/ia-tgoetz/ignition:8.3.6` (and remove `build:`).
  ignition-central:
    build:
      context: .
      args:
        BASE_IMAGE: ${IGNITION_IMAGE:-ghcr.io/ia-tgoetz/ignition}
        IGN_RELEASE: ${IGN_RELEASE:-8.3.6}
    image: ignition-edge:${IGN_RELEASE:-8.3.6}
    user: 0:0
    container_name: ignition-central
    restart: unless-stopped
    ports:
      - "9088:8088"
      - "9043:8043"
      - "9060:8060"
    environment:
      IGNITION_UID: ${IGN_UID:-1000}
      IGNITION_GID: ${IGN_GID:-1000}
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME is required}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD is required}
      TZ: ${TZ:-America/New_York}
    command: >
      -n ignition-central
      --
      -Dignition.license.leased-activation-terminate-sessions-on-shutdown=true
    volumes:
      - ignition-central-data:/usr/local/bin/ignition/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ignition-net

volumes:
  ignition-central-data:
