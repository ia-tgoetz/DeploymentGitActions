# Test overlay — adds a central gateway container alongside Edge for GAN testing.
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  ignition-edge:
    depends_on:
      ignition-central:
        condition: service_healthy

  # Central gateway uses the same base image. If you want modules on the
  # central GW too, add a bind mount the same way docker-compose.yml does.
  ignition-central:
    image: ${IGNITION_IMAGE:-ghcr.io/ia-tgoetz/ignition}:${IGN_RELEASE:-8.3.6}
    user: 0:0
    container_name: ignition-central
    restart: unless-stopped
    ports:
      - "9088:8088"
      - "9043:8043"
      - "9060:8060"
    environment:
      IGNITION_UID: ${IGN_UID:-1000}
      IGNITION_GID: ${IGN_GID:-1000}
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME is required}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD is required}
      TZ: ${TZ:-America/New_York}
    command: >
      -n ignition-central
      -m ${IGN_MAX_HEAP:-2048}
      --
      -Dignition.license.leased-activation-terminate-sessions-on-shutdown=true
    mem_limit: ${IGN_MEM_LIMIT:-4g}
    cpus: ${IGN_CPUS:-2.0}
    volumes:
      - ignition-central-data:/usr/local/bin/ignition/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ignition-net

volumes:
  ignition-central-data:
