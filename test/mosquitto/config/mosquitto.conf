# Test MQTT broker — mirrors Chariot's expected behavior for local dev
# Chariot uses MQTT 3.1.1 over TLS (port 8883) with CA cert server auth

# Plain listener for local/unauthenticated testing only
listener 1883
allow_anonymous true

# TLS listener — matches Chariot's 8883 profile
listener 8883
allow_anonymous false
cafile /mosquitto/certs/ca.crt
# Chariot uses server-side CA auth; clients verify the server cert but
# do not present their own — require_certificate stays false
require_certificate false
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/

log_type all
