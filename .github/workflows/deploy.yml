name: Deploy Ignition Edge

on:
  push:
    branches: [main]
    paths-ignore:
      # Agent-authored memory updates must NOT trigger another deploy
      - 'scripts/memory.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    permissions:
      contents: write   # bumped from read so the agent can push memory.md
      packages: read

    steps:
      - name: Verify Docker access
        run: docker info

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure base Ignition image is available
        run: bash scripts/load-image.sh 2>&1 | tee load-image-log.txt
        env:
          IGN_RELEASE: "8.3.6"
          IGNITION_IMAGE: ghcr.io/${{ github.repository_owner }}/ignition
          IMAGE_TAR_PATH: /opt/ignition-images/ignition-8.3.6.tar

      - name: Fetch third-party modules
        run: bash scripts/fetch-modules.sh 2>&1 | tee fetch-modules-log.txt

      - name: Write runtime .env
        run: |
          IGN_NAME="${IGN_NAME_OVERRIDE:-$(hostname | tr '[:upper:]' '[:lower:]')}"
          cat > .env <<EOF
          IGN_RELEASE=8.3.6
          IGNITION_IMAGE=ghcr.io/${{ github.repository_owner }}/ignition
          IGN_NAME=${IGN_NAME}
          IGN_MODE=prod
          IGN_UID=1000
          IGN_GID=1000
          TZ=America/Chicago
          GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME}
          GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD}
          GATEWAY_MODULES_ACCEPTED=com.cirruslink.mqtt.transmission.gateway
          ACCEPT_MODULE_LICENSES=com.cirruslink.mqtt.transmission.gateway
          ACCEPT_MODULE_CERTS=com.cirruslink.mqtt.transmission.gateway
          EOF
          chmod 600 .env
        env:
          IGN_NAME_OVERRIDE: ${{ secrets.IGN_NAME }}
          GATEWAY_ADMIN_USERNAME: ${{ secrets.GATEWAY_ADMIN_USERNAME }}
          GATEWAY_ADMIN_PASSWORD: ${{ secrets.GATEWAY_ADMIN_PASSWORD }}

      - name: Build derived image (bakes in .modl files)
        run: docker compose build

      - name: Restart Ignition Edge
        run: |
          docker compose down --timeout 60
          docker compose up -d

      - name: Wait for gateway to be healthy
        run: bash scripts/health-check.sh 2>&1 | tee health-check-log.txt

      # ==========================================================================
      # Claude Agent — wakes up only on failure, investigates, may record a lesson
      # ==========================================================================
      - name: Run Claude agent on failure
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          echo "Deploy failed — starting Claude agent in venv (PEP 668-safe)..."
          python3 -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install --quiet --upgrade pip
          /tmp/agent-venv/bin/pip install --quiet -r scripts/requirements.txt
          /tmp/agent-venv/bin/python scripts/deploy_agent.py

      - name: Commit agent memory if changed
        if: always()
        run: |
          if ! git diff --quiet -- scripts/memory.md 2>/dev/null; then
            echo "Agent recorded a new lesson — committing."
            git config --local user.name "Claude DevOps Agent"
            git config --local user.email "noreply@anthropic.com"
            git add scripts/memory.md
            git commit -m "docs: agent recorded new lesson [skip ci]"
            git push
          else
            echo "No memory changes to commit."
          fi

      - name: Clean up secrets
        if: always()
        run: rm -f .env load-image-log.txt health-check-log.txt fetch-modules-log.txt
