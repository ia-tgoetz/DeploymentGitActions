name: Deploy Ignition Edge

on:
  push:
    branches: [main]
    paths-ignore:
      # Agent-authored memory updates must NOT trigger another deploy
      - 'scripts/memory.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    environment: production
    permissions:
      contents: write   # bumped from read so the agent can push memory.md
      packages: read

    steps:
      - name: Verify Docker access
        run: docker info

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure derived Ignition Edge image is available
        run: bash scripts/load-image.sh 2>&1 | tee load-image-log.txt
        env:
          IGN_RELEASE: "8.3.6"
          # Derived image with MQTT Transmission baked into user-lib/modules.
          # Built via build/edgeGwBuild/Dockerfile, pushed via
          # scripts/push-image-to-ghcr.sh. No runtime module fetch needed.
          IGNITION_IMAGE: ghcr.io/${{ github.repository_owner }}/ignition-edge
          IMAGE_TAR_PATH: /opt/ignition-images/ignition-edge-8.3.6.tar

      - name: Write runtime .env
        run: |
          IGN_NAME="${IGN_NAME_OVERRIDE:-$(hostname | tr '[:upper:]' '[:lower:]')}"
          # Source GAN config (host, port, SSL flags, etc.) so it can flow
          # into docker-compose's GATEWAY_NETWORK_0_* env vars on first boot.
          if [ -f config/central-gateway.env ]; then
            set -a; source config/central-gateway.env; set +a
          fi
          cat > .env <<EOF
          IGN_RELEASE=8.3.6
          IGNITION_IMAGE=ghcr.io/${{ github.repository_owner }}/ignition-edge
          IGN_NAME=${IGN_NAME}
          IGN_MODE=prod
          IGN_UID=1000
          IGN_GID=1000
          TZ=America/Chicago
          IGN_MAX_HEAP=2048
          IGN_MEM_LIMIT=4g
          IGN_CPUS=2.0
          GATEWAY_ADMIN_USERNAME=${GATEWAY_ADMIN_USERNAME}
          GATEWAY_ADMIN_PASSWORD=${GATEWAY_ADMIN_PASSWORD}
          ACCEPT_MODULE_LICENSES=com.cirruslink.mqtt.transmission.gateway
          ACCEPT_MODULE_CERTS=com.cirruslink.mqtt.transmission.gateway
          GAN_HOST=${GAN_HOST}
          GAN_PORT=${GAN_PORT}
          GAN_PINGRATE=${GAN_PINGRATE}
          GAN_ENABLESSL=${GAN_ENABLESSL}
          GAN_ENABLED=${GAN_ENABLED}
          IGN_FLEET_KEYSTORE_ALIAS=${IGN_FLEET_KEYSTORE_ALIAS:-edge-fleet}
          IGN_FLEET_KEYSTORE_PASSWORD=${IGN_FLEET_KEYSTORE_PASSWORD:-changeit}
          EOF
          chmod 600 .env
        env:
          IGN_NAME_OVERRIDE: ${{ secrets.IGN_NAME }}
          GATEWAY_ADMIN_USERNAME: ${{ secrets.GATEWAY_ADMIN_USERNAME }}
          GATEWAY_ADMIN_PASSWORD: ${{ secrets.GATEWAY_ADMIN_PASSWORD }}
          # Optional: override the fleet keystore password if you set a
          # non-default value when running generate-fleet-cert. Falls
          # back to "changeit" (matches script default) if Secret unset.
          IGN_FLEET_KEYSTORE_PASSWORD: ${{ secrets.IGN_FLEET_KEYSTORE_PASSWORD }}

      - name: Set transmitter edgeNodeId to gateway name
        run: |
          IGN_NAME="${IGN_NAME_OVERRIDE:-$(hostname | tr '[:upper:]' '[:lower:]')}"
          bash scripts/configure-transmitter.sh "$IGN_NAME"
        env:
          IGN_NAME_OVERRIDE: ${{ secrets.IGN_NAME }}

      - name: Restart Ignition Edge
        run: |
          docker compose down --timeout 60
          docker compose up -d

      - name: Wait for gateway to be healthy
        run: bash scripts/health-check.sh 2>&1 | tee health-check-log.txt

      # ==========================================================================
      # Claude Agent — wakes up only on failure, investigates, may record a lesson
      # ==========================================================================
      - name: Run Claude agent on failure
        if: failure()
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          echo "Deploy failed — starting Claude agent in venv (PEP 668-safe)..."
          python3 -m venv /tmp/agent-venv
          /tmp/agent-venv/bin/pip install --quiet --upgrade pip
          /tmp/agent-venv/bin/pip install --quiet -r scripts/requirements.txt
          /tmp/agent-venv/bin/python scripts/deploy_agent.py

      - name: Commit agent memory if changed
        if: always()
        run: |
          if ! git diff --quiet -- scripts/memory.md 2>/dev/null; then
            echo "Agent recorded a new lesson — committing."
            git config --local user.name "Claude DevOps Agent"
            git config --local user.email "noreply@anthropic.com"
            git add scripts/memory.md
            git commit -m "docs: agent recorded new lesson [skip ci]"
            git push
          else
            echo "No memory changes to commit."
          fi

      - name: Clean up secrets
        if: always()
        run: rm -f .env load-image-log.txt health-check-log.txt
