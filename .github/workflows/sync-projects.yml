name: Sync Projects (No Restart)

# Syncs the Ignition projects folder (and gateway configuration) to the IPC
# without performing a full gateway restart. This leverages Ignition 8.3's
# native file-watcher to pick up changes on the host's bind-mounted volumes
# in real-time.

on:
  workflow_dispatch:
    inputs:
      ipc:
        description: 'Target a single IPC by hostname (leave empty to sync the entire fleet)'
        type: string
        default: ''

jobs:
  # -----------------------------------------------------------------------
  # discover: read config/fleet.txt (or the workflow_dispatch input) and
  # emit a JSON array of hostnames the sync job's matrix consumes.
  # -----------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    outputs:
      ipcs: ${{ steps.read.outputs.ipcs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target IPCs
        id: read
        run: |
          set -euo pipefail
          target='${{ github.event.inputs.ipc }}'
          if [[ -n "$target" ]]; then
            echo "Targeting single IPC: $target"
            ipcs=$(echo "$target" | jq -R . | jq -sc .)
          else
            if [[ ! -f config/fleet.txt ]]; then
              echo "ERROR: config/fleet.txt is missing." >&2
              exit 1
            fi
            # Strip comments + blank lines + trailing whitespace, JSON-encode
            ipcs=$(sed -E 's/[[:space:]]+$//' config/fleet.txt \
                    | grep -vE '^\s*(#|$)' \
                    | jq -R . | jq -sc .)
          fi
          echo "Fleet roster (matrix): $ipcs"
          echo "ipcs=$ipcs" >> "$GITHUB_OUTPUT"

  # -----------------------------------------------------------------------
  # sync: matrix job, one per IPC. Updates the workspace files on the host.
  # Bind mounts ensure the running container sees the new project state.
  # -----------------------------------------------------------------------
  sync:
    needs: discover
    if: needs.discover.outputs.ipcs != '[]' && needs.discover.outputs.ipcs != ''
    strategy:
      fail-fast: false
      matrix:
        ipc: ${{ fromJSON(needs.discover.outputs.ipcs) }}
    runs-on: [self-hosted, "${{ matrix.ipc }}"]
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Verify Docker access
        run: docker info

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Ensure we get a clean state matching the branch
          clean: true

      - name: Set transmitter edgeNodeId (if resources changed)
        run: bash scripts/configure-transmitter.sh "${{ matrix.ipc }}"

      - name: Verify Gateway Health
        run: bash scripts/health-check.sh
        env:
          # Use a shorter timeout for sync verification
          HEALTH_MAX_RETRIES: 5
          HEALTH_INTERVAL: 5

      - name: Report Sync Status
        run: |
          echo "Successfully synced projects and configuration to ${{ matrix.ipc }}."
          echo "Ignition 8.3 will automatically detect changes in the bind-mounted volumes."
