services:
  ignition-edge:
    # Pre-built derived image with Cirrus Link MQTT Transmission baked into
    # /usr/local/bin/ignition/user-lib/modules. Built once via
    # build/edgeGwBuild/Dockerfile and pushed to GHCR by
    # scripts/push-image-to-ghcr.sh. IPCs pull this; no runtime module mount
    # or install pipeline needed.
    image: ${IGNITION_IMAGE:-ghcr.io/ia-tgoetz/ignition-edge}:${IGN_RELEASE:-8.3.6}
    user: 0:0
    container_name: ${IGN_NAME:-ignition-edge}
    # Container's internal $HOSTNAME — set to the IPC hostname so logs,
    # GAN identity hints, and `docker exec ... hostname` all line up with
    # the IPC's name rather than a random container ID. Pairs with
    # container_name above so `docker ps` and the in-container hostname
    # report the same value.
    hostname: ${IGN_NAME:-ignition-edge}
    restart: unless-stopped
    ports:
      - "${IGN_PORT:-8088}:8088"
      - "${IGN_HTTPS_PORT:-8043}:8043"
      - "${IGN_GAN_PORT:-8060}:8060"
    environment:
      IGNITION_UID: ${IGN_UID:-1000}
      IGNITION_GID: ${IGN_GID:-1000}
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME is required}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD is required}
      IGNITION_EDITION: edge
      TZ: ${TZ:-America/New_York}
      # License/cert acceptance for the modules baked into the image.
      # Comma-separated, can include multiple module IDs.
      ACCEPT_MODULE_LICENSES: ${ACCEPT_MODULE_LICENSES:-com.cirruslink.mqtt.transmission.gateway}
      ACCEPT_MODULE_CERTS: ${ACCEPT_MODULE_CERTS:-com.cirruslink.mqtt.transmission.gateway}
      # Gateway Network outgoing connection (seeded on first DB init only —
      # has no effect on subsequent boots; manage further via the web UI
      # once the gateway is up). Defaults wire up an outbound link to
      # engine-demo.chariot.io; override per-site via config/central-gateway.env.
      GATEWAY_NETWORK_0_HOST: ${GAN_HOST:-engine-demo.chariot.io}
      GATEWAY_NETWORK_0_PORT: ${GAN_PORT:-8060}
      GATEWAY_NETWORK_0_PINGRATE: ${GAN_PINGRATE:-1000}
      GATEWAY_NETWORK_0_ENABLESSL: ${GAN_ENABLESSL:-true}
      GATEWAY_NETWORK_0_ENABLED: ${GAN_ENABLED:-true}
    # No -h/-s/-a flags: container's internal listener is 8088/8043 by
    # default; ports: above maps them to the host. Public-address flags
    # are only for reverse-proxy / DNS scenarios.
    # -m sets the JVM max heap in MB; default 2048 is generous for Edge.
    #
    # Fleet identity: when a metro-keystore is baked into the image at
    # /usr/local/bin/ignition/webserver/metro-keystore (via
    # scripts/generate-fleet-cert + run-build-edge), Ignition uses it
    # as the gateway's GAN identity. -Dmetro.keystore.password supplies
    # the keystore password — Ignition reads the file from the
    # conventional path and uses the 'metro-key' alias by convention,
    # so no path/type/alias JVM properties are needed. If the keystore
    # is absent from the image, Ignition auto-generates a per-IPC
    # metro keystore on first boot (default behavior).
    command: >
      -n ${IGN_NAME:-ignition-edge}
      -m ${IGN_MAX_HEAP:-2048}
      --
      -Dignition.config.mode=${IGN_MODE:-prod}
      -Dignition.license.leased-activation-terminate-sessions-on-shutdown=true
      -Dmetro.keystore.password=${IGN_FLEET_KEYSTORE_PASSWORD:-changeit}
    # Container resource limits — protect the IPC host from a runaway
    # gateway. Heap (-m above) is bounded inside this; 4g leaves room
    # for off-heap (DB caches, modules) and OS overhead. Override via
    # IGN_MEM_LIMIT / IGN_CPUS if a site needs different sizing.
    mem_limit: ${IGN_MEM_LIMIT:-4g}
    cpus: ${IGN_CPUS:-2.0}
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ignition-resources:/usr/local/bin/ignition/data/config/resources
      - ignition-projects:/usr/local/bin/ignition/data/projects
      # Pre-trusted certs for outgoing GAN connections. Drop the Hub's
      # public .crt (e.g. engine-demo.chariot.io.crt) into
      # services/pki/trusted/clients/ to bypass Ignition's cert-quarantine
      # step on first boot. The destination is Ignition's GAN-client
      # trust store (data/config/local/ignition/gateway-network/client/
      # security/pki/trusted/certs/). The bind mount overlays just this
      # subdirectory inside the ignition-data named volume, so Ignition
      # can still manage the rest of /data/ at runtime.
      - ./services/pki/trusted/clients:/usr/local/bin/ignition/data/config/local/ignition/gateway-network/client/security/pki/trusted/certs
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ignition-net

networks:
  ignition-net:
    driver: bridge

volumes:
  ignition-data:
  ignition-resources:
    driver: local
    driver_opts:
      type: none
      device: services/config/resources
      o: bind
  ignition-projects:
    driver: local
    driver_opts:
      type: none
      device: services/projects
      o: bind
