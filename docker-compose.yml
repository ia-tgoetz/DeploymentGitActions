services:
  ignition-edge:
    # Pre-built derived image with Cirrus Link MQTT Transmission baked into
    # /usr/local/bin/ignition/user-lib/modules. Built once via
    # build/edgeGwBuild/Dockerfile and pushed to GHCR by
    # scripts/push-image-to-ghcr.sh. IPCs pull this; no runtime module mount
    # or install pipeline needed.
    image: ${IGNITION_IMAGE:-ghcr.io/ia-tgoetz/ignition-edge}:${IGN_RELEASE:-8.3.6}
    user: 0:0
    container_name: ${IGN_NAME:-ignition-edge}
    restart: unless-stopped
    ports:
      - "${IGN_PORT:-8088}:8088"
      - "${IGN_HTTPS_PORT:-8043}:8043"
      - "${IGN_GAN_PORT:-8060}:8060"
    environment:
      IGNITION_UID: ${IGN_UID:-1000}
      IGNITION_GID: ${IGN_GID:-1000}
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME is required}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD is required}
      IGNITION_EDITION: edge
      TZ: ${TZ:-America/New_York}
      # License/cert acceptance for the modules baked into the image.
      # Comma-separated, can include multiple module IDs.
      ACCEPT_MODULE_LICENSES: ${ACCEPT_MODULE_LICENSES:-com.cirruslink.mqtt.transmission.gateway}
      ACCEPT_MODULE_CERTS: ${ACCEPT_MODULE_CERTS:-com.cirruslink.mqtt.transmission.gateway}
    # No -h/-s/-a flags: container's internal listener is 8088/8043 by
    # default; ports: above maps them to the host. Public-address flags
    # are only for reverse-proxy / DNS scenarios.
    command: >
      -n ${IGN_NAME:-ignition-edge}
      --
      -Dignition.config.mode=${IGN_MODE:-prod}
      -Dignition.license.leased-activation-terminate-sessions-on-shutdown=true
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ignition-resources:/usr/local/bin/ignition/data/config/resources
      - ignition-projects:/usr/local/bin/ignition/data/projects
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ignition-net

networks:
  ignition-net:
    driver: bridge

volumes:
  ignition-data:
  ignition-resources:
    driver: local
    driver_opts:
      type: none
      device: services/config/resources
      o: bind
  ignition-projects:
    driver: local
    driver_opts:
      type: none
      device: services/projects
      o: bind
