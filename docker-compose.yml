services:
  ignition-edge:
    image: ${IGNITION_IMAGE:-ghcr.io/ia-tgoetz/ignition}:${IGN_RELEASE:-8.3.6}
    user: 0:0
    container_name: ${IGN_NAME:-ignition-edge}
    restart: unless-stopped
    ports:
      - "${IGN_PORT:-8088}:8088"
      - "${IGN_HTTPS_PORT:-8043}:8043"
      - "${IGN_GAN_PORT:-8060}:8060"
    environment:
      IGNITION_UID: ${IGN_UID:-1000}
      IGNITION_GID: ${IGN_GID:-1000}
      ACCEPT_IGNITION_EULA: "Y"
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:?GATEWAY_ADMIN_USERNAME is required}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:?GATEWAY_ADMIN_PASSWORD is required}
      IGNITION_EDITION: edge
      TZ: ${TZ:-America/New_York}
      # Pre-accept third-party module licenses on first boot.
      # Module ID is the <id> element from module.xml inside the .modl —
      # for Cirrus Link MQTT Transmission 5.0.3 that's
      # com.cirruslink.mqtt.transmission.gateway (the .gateway suffix IS
      # part of the canonical ID, not just the resource-folder path).
      GATEWAY_MODULES_ACCEPTED: ${GATEWAY_MODULES_ACCEPTED:-com.cirruslink.mqtt.transmission.gateway}
      ACCEPT_MODULE_LICENSES: ${ACCEPT_MODULE_LICENSES:-com.cirruslink.mqtt.transmission.gateway}
      ACCEPT_MODULE_CERTS: ${ACCEPT_MODULE_CERTS:-com.cirruslink.mqtt.transmission.gateway}
    # No -h/-s/-a flags: the container's internal listener is 8088/8043 by
    # default, and the ports: section above maps them to the host. -h/-s/-a
    # are only for configuring the gateway's public-facing URL when behind
    # a reverse proxy or stable DNS.
    #
    # Module install: services/modules is bind-mounted at the path pointed
    # to by -Dignition.gateway.externalModulesFolder. With
    # -Dignition.modules.install.unattended=true, Ignition auto-installs any
    # *.modl found there on first boot. -Dignition.modules.install.trust-unknown-
    # certificates=true accepts the cert without prompting.
    command: >
      -n ${IGN_NAME:-ignition-edge}
      --
      -Dignition.config.mode=${IGN_MODE:-prod}
      -Dignition.license.leased-activation-terminate-sessions-on-shutdown=true
      -Dignition.allowunsignedmodules=true
      -Dignition.modules.install.unattended=true
      -Dignition.modules.install.trust-unknown-certificates=true
      -Dignition.gateway.externalModulesFolder=/usr/local/bin/ignition/external-modules
    volumes:
      - ignition-data:/usr/local/bin/ignition/data
      - ignition-resources:/usr/local/bin/ignition/data/config/resources
      - ignition-projects:/usr/local/bin/ignition/data/projects
      # Direct bind mount (NOT named-volume-with-bind) — matches the IA
      # module-dev reference. Named volumes add a layer that interferes
      # with Ignition's first-boot module scan, even when configured to
      # point at the same host path.
      - ./services/modules:/usr/local/bin/ignition/external-modules
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/StatusPing"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - ignition-net

networks:
  ignition-net:
    driver: bridge

volumes:
  ignition-data:
  ignition-resources:
    driver: local
    driver_opts:
      type: none
      device: services/config/resources
      o: bind
  ignition-projects:
    driver: local
    driver_opts:
      type: none
      device: services/projects
      o: bind
